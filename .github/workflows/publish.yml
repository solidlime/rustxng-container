name: publish

# Mirror the newest upstream release into ghcr.io as a container image so
# watchtower on the NAS can follow it. Nothing is rebuilt when the upstream
# tag is already published, so watchtower sees no digest change all day.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile', 'entrypoint.sh', '.github/workflows/publish.yml']

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest upstream release
        id: upstream
        run: |
          set -euo pipefail
          tag=$(curl -fsSL https://api.github.com/repos/sahenjp/RustXNG/releases/latest | jq -r .tag_name)
          test -n "$tag" -a "$tag" != "null"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this version already published?
        id: check
        run: |
          if docker manifest inspect "ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'false'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'false'
        with:
          context: .
          push: true
          build-args: RUSTXNG_VERSION=${{ steps.upstream.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.upstream.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Summary
        run: echo "${{ steps.upstream.outputs.tag }} exists=${{ steps.check.outputs.exists }}" >> "$GITHUB_STEP_SUMMARY"
