name: publish

# Mirror the newest upstream release into ghcr.io as a container image so
# watchtower on the NAS can follow it. Nothing is rebuilt when the upstream
# tag is already published, so watchtower sees no digest change all day.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile', 'entrypoint.sh', '.github/workflows/publish.yml']

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest upstream release
        id: upstream
        run: |
          set -euo pipefail
          tag=$(curl -fsSL https://api.github.com/repos/sahenjp/RustXNG/releases/latest | jq -r .tag_name)
          test -n "$tag" -a "$tag" != "null"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Compute the image revision
        id: rev
        run: |
          set -euo pipefail
          # イメージの中身は Dockerfile と entrypoint.sh だけで決まる。この2つの
          # ハッシュをタグに混ぜるので、上流が同じでも自分の変更は再ビルドされる。
          sha=$(cat Dockerfile entrypoint.sh | sha256sum | cut -c1-12)
          echo "tag=${{ steps.upstream.outputs.tag }}-$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this version already published?
        id: check
        env:
          TAG: ${{ steps.rev.outputs.tag }}
        run: |
          set -euo pipefail
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          # ghcr.io rejects both Bearer GITHUB_TOKEN and Basic (HTTP 403/401).
          # An anonymous pull token works while the package is public -- if this
          # package ever goes private, swap this for the /token exchange with
          # the GitHub App/PAT credentials instead.
          tok=$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull&service=ghcr.io" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$repo/manifests/$TAG")
          echo "manifest status: $code"
          case "$code" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected GHCR status $code -- refusing to guess"; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'false'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'false'
        with:
          context: .
          push: true
          build-args: RUSTXNG_VERSION=${{ steps.upstream.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.rev.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.upstream.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Summary
        run: echo "upstream=${{ steps.upstream.outputs.tag }} revision=${{ steps.rev.outputs.tag }} exists=${{ steps.check.outputs.exists }}" >> "$GITHUB_STEP_SUMMARY"
