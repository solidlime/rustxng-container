# NAS (Portainer stack) definition.
services:
  rustxng:
    image: ghcr.io/solidlime/rustxng-container:latest
    container_name: rustxng
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      # settings.toml と index-data/ がここに入る。消すと secret_key も作り直しになる。
      - /volume1/docker/rustxng:/data
    environment:
      TZ: Asia/Tokyo
      RUSTXNG_PORT: "8888"
    labels:
      # The running watchtower has no --label-enable flag, so it watches every
      # container anyway; the label keeps it working if that ever changes.
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8888/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
